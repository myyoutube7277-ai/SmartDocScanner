name: SmartDocScanner Final Verified Build 2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Apply final fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/smartdocscanner/MainActivity.kt')
          s=p.read_text()
          old='''        super.onCreate(savedInstanceState)\n        setContent { SmartDocApp() }'''
          new='''        super.onCreate(savedInstanceState)\n        if (checkSelfPermission(Manifest.permission.CAMERA) != android.content.pm.PackageManager.PERMISSION_GRANTED) {\n            requestPermissions(arrayOf(Manifest.permission.CAMERA), 501)\n        }\n        setContent { SmartDocApp() }'''
          s=s.replace(old,new)
          s=s.replace('prepareScanFile(c, it, "gallery_adjusted")','it')
          p.write_text(s)
          q=Path('app/src/main/java/com/smartdocscanner/ScannerScreenFixed.kt')
          x=q.read_text()
          x=x.replace('@Composable\nfun ScannerScreenFixed','@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun ScannerScreenFixed')
          q.write_text(x)
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartDocScanner-final-verified-2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
